<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hazar-ai</title>
  
  <!-- ADDED: Browser tab icon (favicon) -->
  <link rel="icon" href="/.image/logo.png" type="image/png">
  
  <!-- External Libraries: Syntax highlighting, Icons, and Markdown parsing -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- ADDED: KaTeX for native LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.0.0/lib/index.umd.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  
  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    
    <!-- ========================================== -->
    <!-- HEADER SECTION                             -->
    <!-- Contains the dynamic logo and app title    -->
    <!-- ========================================== -->
    <header>
      <div class="logo-wrapper">
	<img id="logoImg" src="../.image/logo.png" alt="hazar-ai logo">
      </div>
      <span class="header-title">hazar-ai</span>
      <a href="https://phazarik.github.io" target="_blank" class="header-profile">phazarik.github.io</a>
    </header>

    <!-- ========================================== -->
    <!-- MAIN LAYOUT                                -->
    <!-- Splits the screen into Left (Chat)         -->
    <!-- and Right (Logs/Stats) panels              -->
    <!-- ========================================== -->
    <div class="main-layout">
      
      <!-- ======================================== -->
      <!-- LEFT PANEL: Chat History and Input Area  -->
      <!-- ======================================== -->
      <div class="left-panel">
        
        <!-- Chat History Container -->
        <div class="chat-col" id="history"></div>

        <!-- Drag handle: lets the user resize the chat history area up/down.
             The footer (toolbar + input row) below it keeps a fixed size. -->
        <div class="chat-resize-handle" id="chatResizeHandle" title="Drag to resize"></div>

        <!-- Footer / Input Area -->
        <footer>
          <!-- Displays currently loaded files -->
          <div class="file-context" id="fileList">NO FILES ATTACHED.</div>

	  <!-- Toolbar: Model selection, Skills, and System Controls -->
          <div class="toolbar-row">
            <div class="tool-group">
              <span class="tool-label">MODEL:</span>
              <button type="button" class="tool-btn active" data-model="auto">Auto</button>
              <button type="button" class="tool-btn" data-model="fast">Fast</button>
              <button type="button" class="tool-btn" data-model="smart">Smart</button>
              <button type="button" class="tool-btn" data-model="local">Local</button>
              
              <!-- Skill Selector placed right next to the model buttons -->
              <span class="tool-label" style="margin-left: 10px;">SKILL:</span>
              <select id="skillSelector" class="tool-btn">
                <option value="">None</option>
              </select>
            </div>

            <div class="tool-group">
              <span class="tool-label">CONTROLS:</span>
              <button type="button" class="tool-btn" id="optimizeTokensBtn" title="Strips empty lines & whitespace from attached files">
                <i class="bi bi-lightning-charge"></i> Optimize Tokens: OFF
              </button>
              <button type="button" class="tool-btn active" id="toggleMemoryBtn" title="Toggle memory persistence">
                <i class="bi bi-cpu"></i> Memory: ON
              </button>
	      <button type="button" class="tool-btn" id="clearMemoryBtn" title="Wipe conversation history">
                <i class="bi bi-trash"></i> Clear Memory
              </button>
            </div>
          </div>

          <!-- Primary User Input Row -->
          <div class="input-row">
            <!-- Hidden file input triggered by the Attach button -->
            <input type="file" id="fileInput" multiple style="display:none;">
            <button id="attachBtn"><i class="bi bi-paperclip"></i> Attach file</button>
            
            <textarea id="queryInput" placeholder="ENTER QUERY..."></textarea>
            
            <!-- Animated Loading Indicator (Hidden by default) -->
	    <span id="loadingBuffer" class="pulsate"
		  style="display:none; color: var(--accent); align-self: center; font-size: 20px;">
	      <i class="bi bi-arrow-repeat"></i>
	    </span>
            
            <button id="sendBtn"><i class="bi bi-send"></i> Send</button>
          </div>
        </footer>
      </div>

      <!-- ======================================== -->
      <!-- RIGHT PANEL: Diagnostics and Logs        -->
      <!-- ======================================== -->
      <div class="right-panel">
        <!-- Live Server Logs -->
        <div class="log-col" id="logPanel">
          <div class="log-header">LOG</div>
          <div id="logs"></div>
        </div>

	<!-- Usage Statistics & Token Bar -->
        <div class="stats-panel" id="statsPanel">
          <div class="stats-text" id="statsText">Model: N/A | Free Tokens: --- (0% used)</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="tokBarFill"></div>
          </div>
        </div>
      
      </div>
    </div>
  </div>

  <!-- Local Script Execution -->
  <script src="/script.js"></script>
</body>
</html>
