<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrachuGPT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0f13;
    --surface:  #161b22;
    --card:     #1c2128;
    --border:   #30363d;
    --text:     #cdd9e5;
    --muted:    #768390;
    --accent:   #58a6ff;
    --green:    #3fb950;
    --amber:    #d29922;
    --red:      #f85149;
    --purple:   #bc8cff;
    --radius:   8px;
    --font:     "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }

  /* ── Layout ──────────────────────────────────────────────────────────────── */
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--purple); }
  .memory-badge {
    margin-left: auto; font-size: 11px; color: var(--muted);
    background: var(--card); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 20px; cursor: pointer;
  }
  .memory-badge:hover { border-color: var(--accent); color: var(--accent); }

  .main { display: grid; grid-template-columns: 1fr 320px; overflow: hidden; }

  /* ── Chat column ─────────────────────────────────────────────────────────── */
  .chat-col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }

  #history {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  .msg { border-radius: var(--radius); padding: 12px 14px; line-height: 1.6; max-width: 100%; }
  .msg.user {
    background: #1f2d3d; border: 1px solid #2d4a6e;
    align-self: flex-end; max-width: 80%; white-space: pre-wrap; color: #b0d0f0;
  }
  .msg.assistant {
    background: var(--card); border: 1px solid var(--border);
    align-self: flex-start; width: 100%;
  }
  .msg-label { font-size: 10px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Markdown inside assistant messages */
  .msg.assistant pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .msg.assistant code:not(pre code) { background: #0d1117; padding: 1px 5px; border-radius: 4px; color: var(--purple); }
  .msg.assistant p { margin: 6px 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0 6px 18px; }
  .msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { margin: 10px 0 4px; color: var(--accent); }

  .cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent); animation: blink .7s step-end infinite; vertical-align: text-bottom; margin-left: 1px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Log + controls column ───────────────────────────────────────────────── */
  .side-col { display: flex; flex-direction: column; overflow: hidden; }

  .side-header { padding: 8px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); border-bottom: 1px solid var(--border); }

  #log {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    font-size: 11px; line-height: 1.7; color: var(--muted);
  }
  #log .entry { display: flex; gap: 6px; }
  #log .entry .ts { color: #3d4d5c; flex-shrink: 0; }
  #log .entry.info  .msg-text { color: var(--muted); }
  #log .entry.model .msg-text { color: var(--green); }
  #log .entry.warn  .msg-text { color: var(--amber); }
  #log .entry.err   .msg-text { color: var(--red); }
  #log .entry.save  .msg-text { color: var(--purple); }

  .stats-bar {
    padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted);
    display: none; flex-direction: column; gap: 4px;
  }
  .stats-bar.visible { display: flex; }
  .tok-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; }
  .tok-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }

  /* ── Input area ──────────────────────────────────────────────────────────── */
  footer { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }

  .controls { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

  select, .toggle-label { font-family: var(--font); font-size: 11px; }
  select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px 8px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .toggle-label {
    display: flex; align-items: center; gap: 5px; cursor: pointer;
    color: var(--muted); user-select: none; padding: 4px 8px;
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .toggle-label input { accent-color: var(--accent); }
  .toggle-label:has(input:checked) { color: var(--accent); border-color: var(--accent); }

  .input-row { display: flex; gap: 8px; }
  #queryInput {
    flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 12px; font-family: var(--font); font-size: 13px;
    resize: none; height: 72px; line-height: 1.5;
  }
  #queryInput:focus { outline: none; border-color: var(--accent); }
  #queryInput::placeholder { color: var(--muted); }

  #sendBtn {
    background: var(--accent); color: #0d1117; border: none; border-radius: var(--radius);
    padding: 0 18px; font-family: var(--font); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: opacity .15s; white-space: nowrap; align-self: stretch;
  }
  #sendBtn:hover { opacity: .85; }
  #sendBtn:disabled { opacity: .4; cursor: not-allowed; }
  #sendBtn.stop { background: var(--red); color: #fff; }

  .clear-btn {
    background: none; color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px 10px; font-family: var(--font);
    font-size: 11px; cursor: pointer;
  }
  .clear-btn:hover { color: var(--red); border-color: var(--red); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; } 
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">Prachu<span>GPT</span></div>
    <div class="memory-badge" id="memBadge" onclick="refreshStatus()">● memory</div>
    <button class="clear-btn" onclick="clearMemory()">clear memory</button>
  </header>

  <div class="main">

    <!-- Chat history -->
    <div class="chat-col">
      <div id="history"></div>
    </div>

    <!-- Log + stats -->
    <div class="side-col">
      <div class="side-header">logs</div>
      <div id="log"></div>
      <div class="stats-bar" id="statsBar">
        <div id="statsText"></div>
        <div class="tok-bar-wrap"><div class="tok-bar-fill" id="tokBarFill"></div></div>
      </div>
    </div>

  </div>

  <footer>
    <div class="controls">
      <select id="modelSel">
        <option value="auto">auto</option>
        <option value="fast">fast</option>
        <option value="smart">smart</option>
      </select>
      <select id="skillSel">
        <option value="">no skill</option>
      </select>
      <label class="toggle-label"><input type="checkbox" id="noMemChk"> no memory</label>
      <input type="number" id="maxTokInput" value="900" min="100" max="4000"
        style="width:70px;background:var(--card);color:var(--text);border:1px solid var(--border);
               border-radius:var(--radius);padding:4px 6px;font-family:var(--font);font-size:11px;">
      <span style="font-size:11px;color:var(--muted);align-self:center">max tokens</span>
    </div>
    <div class="input-row">
      <textarea id="queryInput" placeholder="Ask anything… (Shift+Enter for newline, Enter to send)"></textarea>
      <button id="sendBtn" onclick="sendQuery()">Send</button>
    </div>
  </footer>

</div>

<script>
  const API = "http://localhost:5000";
  let currentES = null;

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    await loadSkills();
    await refreshStatus();
  }

  async function loadSkills() {
    try {
      const r = await fetch(`${API}/api/skills`);
      const d = await r.json();
      const sel = document.getElementById("skillSel");
      d.skills.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });
    } catch(e) { addLog("Could not load skills: " + e, "warn"); }
  }

  async function refreshStatus() {
    try {
      const r = await fetch(`${API}/api/status`);
      const d = await r.json();
      const badge = document.getElementById("memBadge");
      badge.textContent = `● ${d.turns} turns · ${d.summaryChars > 0 ? "summary" : "no summary"} · ${d.cachedFiles} files`;
    } catch(e) {}
  }

  async function clearMemory() {
    if (!confirm("Clear all memory?")) return;
    await fetch(`${API}/api/clear`, {method:"POST"});
    addLog("Memory cleared.", "warn");
    refreshStatus();
  }

  // ── Query ─────────────────────────────────────────────────────────────────
  function sendQuery() {
    if (currentES) { currentES.close(); currentES = null; resetBtn(); return; }

    const query = document.getElementById("queryInput").value.trim();
    if (!query) return;

    const model     = document.getElementById("modelSel").value;
    const skill     = document.getElementById("skillSel").value;
    const noMemory  = document.getElementById("noMemChk").checked;
    const maxTokens = parseInt(document.getElementById("maxTokInput").value) || 900;

    // Add user bubble
    appendMsg("user", query);
    document.getElementById("queryInput").value = "";

    // Start assistant bubble with cursor
    const assistantBubble = appendMsg("assistant", "");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    assistantBubble.querySelector(".msg-body").appendChild(cursor);

    let rawReply = "";
    setBtnStop();

    // SSE via POST — we use fetch + ReadableStream since EventSource only does GET
    fetch(`${API}/api/query`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ query, model, skill, noMemory, maxTokens })
    }).then(resp => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      function pump() {
        reader.read().then(({done, value}) => {
          if (done) { onStreamDone(); return; }
          buf += decoder.decode(value, {stream: true});
          const parts = buf.split("\n\n");
          buf = parts.pop();
          parts.forEach(parseSSEChunk);
          pump();
        }).catch(e => { addLog("Stream error: " + e, "err"); onStreamDone(); });
      }

      function parseSSEChunk(chunk) {
        const lines = chunk.split("\n");
        let eventType = "message", data = "";
        lines.forEach(l => {
          if (l.startsWith("event: ")) eventType = l.slice(7).trim();
          if (l.startsWith("data: "))  data      = l.slice(6);
        });
        if (!data) return;

        if (eventType === "log") {
          classifyLog(data);
        } else if (eventType === "token") {
          rawReply += data;
          renderAssistant(assistantBubble, rawReply, cursor);
        } else if (eventType === "done") {
          const stats = JSON.parse(data);
          showStats(stats);
          cursor.remove();
          renderAssistant(assistantBubble, rawReply, null);
          refreshStatus();
          onStreamDone();
        } else if (eventType === "error") {
          addLog("ERROR: " + data, "err");
          cursor.remove();
          onStreamDone();
        }
      }

      pump();
    }).catch(e => {
      addLog("Fetch failed: " + e, "err");
      onStreamDone();
    });
  }

  function onStreamDone() {
    currentES = null;
    resetBtn();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function appendMsg(role, text) {
    const history = document.getElementById("history");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? "you" : "assistant";
    const body = document.createElement("div");
    body.className = "msg-body";
    if (role === "user") {
      body.textContent = text;
    }
    div.appendChild(label);
    div.appendChild(body);
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
    return div;
  }

  function renderAssistant(bubble, raw, cursor) {
    const body = bubble.querySelector(".msg-body");
    // Parse markdown
    const html = marked.parse(raw || "");
    body.innerHTML = html;
    if (cursor) body.appendChild(cursor);
    // Highlight code blocks
    body.querySelectorAll("pre code").forEach(block => hljs.highlightElement(block));
    // Scroll
    document.getElementById("history").scrollTop = document.getElementById("history").scrollHeight;
  }

  // ── Log pane ──────────────────────────────────────────────────────────────
  function addLog(msg, type = "info") {
    const log = document.getElementById("log");
    const now = new Date().toTimeString().slice(0,8);
    const entry = document.createElement("div");
    entry.className = `entry ${type}`;
    entry.innerHTML = `<span class="ts">${now}</span><span class="msg-text">${escHtml(msg)}</span>`;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  function classifyLog(msg) {
    const lower = msg.toLowerCase();
    if (lower.includes("model:"))                addLog(msg, "model");
    else if (lower.includes("saved") || lower.includes("memory")) addLog(msg, "save");
    else if (lower.includes("warning") || lower.includes("not found")) addLog(msg, "warn");
    else if (lower.includes("error") || lower.includes("failed"))      addLog(msg, "err");
    else                                         addLog(msg, "info");
  }

  // ── Stats bar ─────────────────────────────────────────────────────────────
  function showStats(s) {
    const bar   = document.getElementById("statsBar");
    const text  = document.getElementById("statsText");
    const fill  = document.getElementById("tokBarFill");
    const pct   = s.maxTokens > 0 ? Math.min(100, (s.completionTokens / s.maxTokens * 100)).toFixed(1) : 0;
    text.textContent = `prompt ${s.promptTokens} + completion ${s.completionTokens} = ${s.totalTokens} · ${pct}% of ${s.maxTokens}`;
    fill.style.width = pct + "%";
    bar.classList.add("visible");
  }

  // ── Button states ─────────────────────────────────────────────────────────
  function setBtnStop() {
    const btn = document.getElementById("sendBtn");
    btn.textContent = "Stop"; btn.classList.add("stop");
  }
  function resetBtn() {
    const btn = document.getElementById("sendBtn");
    btn.textContent = "Send"; btn.classList.remove("stop");
  }

  // ── Keyboard ──────────────────────────────────────────────────────────────
  document.getElementById("queryInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });

  // ── Utils ─────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  init();
</script>
</body>
</html>
