# ------------------------------------------------------------
# Points the Continue VSCode extension at the local litellm
# proxy. The real file lives here in ~/.ai-setup/; Continue
# finds it because of a symlink at ~/.continue/config.yaml
# pointing back to this file (Continue insists on that exact
# folder, so the symlink is the workaround).
#
# After editing this file, reload the VSCode window for the
# change to show up in Continue's model picker.
# ------------------------------------------------------------

models:
  - name: local-router
    provider: openai
    model: auto              ## let router_hook.py decide fast vs smart
    apiBase: http://localhost:4000
    apiKey: sk-anything      ## only needs to match LITELLM_MASTER_KEY for real if that's set

