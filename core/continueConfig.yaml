# ----------------------------------------------------------------------------
# Continue reference settings
#
# Shows how Continue connects to the local compatible gateway.
# setup.py writes the actual file to ~/.continue/config.yaml.
# The gateway credential comes from ~/.continue/.env.
# ----------------------------------------------------------------------------

name: hazar-ai
version: 1.0.0
schema: v1

models:
  - name: local-router
    provider: openai
    model: auto  # Let the gateway choose fast or smart.
    apiBase: http://localhost:4000
    # Read the stored gateway secret instead of copying provider keys here.
    apiKey: ${{ secrets.LITELLM_MASTER_KEY }}
