# ----------------------------------------------------------------------------
# Cloud and local gateway routes
#
# Defines the auto, fast, smart, and local aliases used by the clients.
# auto is rewritten by routerHook.py; healthy deployments rotate in a group.
# Retry, cooldown, and fallback settings appear near the bottom.
# start.sh generates separate runtime files when local GGUF models exist.
# ----------------------------------------------------------------------------

model_list:

  ## Placeholder: the callback replaces auto with the selected tier.
  - model_name: auto
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  ## Fast-group deployment: a healthy entry can handle lighter requests.
  - model_name: fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: fast
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: fast
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: fast
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  - model_name: fast
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: fast
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: fast
    litellm_params:
      model: openrouter/z-ai/glm-5.2:free
      api_key: os.environ/OPENROUTER_API_KEY

  ## Smart-group deployment: a healthy entry can handle heavier requests.
  - model_name: smart
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
  
  - model_name: smart
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  
  - model_name: smart
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY
  
  - model_name: smart
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  ## Local placeholder: generated configs add every discovered model.
  - model_name: local
    litellm_params:
      model: openai/local
      api_base: http://localhost:8000/v1
      api_key: sk-local

## Retry and fallback policy. The chain is acyclic.
router_settings:
  routing_strategy: usage-based-routing
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 60
  enable_pre_call_checks: true
  fallbacks: [{"auto": ["smart", "fast"]}, {"smart": ["fast"]}]
  ## Keep fallbacks one-way so routes cannot loop between groups.
  
## The callback object is loaded through PYTHONPATH at startup.
litellm_settings:
  callbacks: ["routerHook.router_hook_instance"]
  request_timeout: 120

## Clients authenticate with the key generated during setup.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
